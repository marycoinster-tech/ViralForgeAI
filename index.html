    <style>
      /* Splash / loading screen */
      #splash {
        position: fixed;
        inset: 0;
        background: #1C1C1E;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease, transform 0.5s ease;
      }
      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash .bolt {
        width: 64px;
        height: 64px;
        animation: splash-pulse 1s ease-in-out infinite alternate;
      }
      #splash .wordmark {
        margin-top: 16px;
        font-family: Inter, sans-serif;
        font-weight: 900;
        font-size: 28px;
        letter-spacing: -0.04em;
        color: #FFE500;
      }
      #splash .tagline {
        margin-top: 6px;
        font-family: Inter, sans-serif;
        font-size: 13px;
        color: rgba(255,255,255,0.4);
        letter-spacing: 0.04em;
      }
      #splash .bar {
        margin-top: 32px;
        width: 120px;
        height: 3px;
        background: rgba(255,229,0,0.15);
        border-radius: 99px;
        overflow: hidden;
      }
      #splash .bar-fill {
        height: 100%;
        background: #FFE500;
        border-radius: 99px;
        animation: bar-load 1.2s ease-out forwards;
      }
      @keyframes splash-pulse {
        from { filter: drop-shadow(0 0 10px #FFE500aa); transform: scale(0.95); }
        to   { filter: drop-shadow(0 0 30px #FFE500ff); transform: scale(1.05); }
      }
      @keyframes bar-load {
        from { width: 0; }
        to   { width: 100%; }
      }
    </style>
  </head>
  <body>
    <!-- Splash screen -->
    <div id="splash">
      <svg class="bolt" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="8" fill="#2A2A2A"/>
        <polygon points="19,2 10,18 15,18 13,30 22,14 17,14" fill="#FFE500"/>
      </svg>
      <div class="wordmark">ViralForge AI</div>
      <div class="tagline">GO VIRAL IN SECONDS ⚡</div>
      <div class="bar"><div class="bar-fill"></div></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide splash when React is ready
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('splash');
          if (splash) {
            splash.classList.add('hidden');
            setTimeout(function() { splash.style.display = 'none'; }, 500);
          }
        }, 1400);
      });
    </script>
  </body>
