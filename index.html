<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA + App Meta -->
    <title>ViralForge AI — Go Viral in Seconds ⚡</title>
    <meta name="description" content="AI content engine for Gen Z creators. Generate scroll-stopping hooks, viral scripts, captions, and hashtags in seconds." />
    <meta name="theme-color" content="#FFE500" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ViralForge" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ViralForge AI — Go Viral in Seconds ⚡" />
    <meta property="og:description" content="AI content engine for Gen Z creators. Generate scroll-stopping hooks, viral scripts & captions in seconds." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ViralForge AI ⚡" />
    <meta name="twitter:description" content="Go viral in seconds with AI-powered hooks & scripts for TikTok, Reels & Shorts." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Splash screens for iOS -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
      /* Loading splash */
      #splash {
        position: fixed;
        inset: 0;
        background: #1C1C1C;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      .splash-logo {
        width: 80px;
        height: 80px;
        background: #FFE500;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 40px #FFE500aa;
        animation: splash-pulse 1.5s ease-in-out infinite;
      }
      .splash-logo svg { width: 48px; height: 48px; fill: #1C1C1C; }
      .splash-title {
        font-family: 'Inter', sans-serif;
        font-weight: 900;
        font-size: 28px;
        color: #FFE500;
        letter-spacing: -0.04em;
      }
      .splash-bar-track {
        width: 200px;
        height: 4px;
        background: #333;
        border-radius: 2px;
        overflow: hidden;
      }
      .splash-bar {
        height: 100%;
        background: linear-gradient(90deg, #FFE500, #FFB800);
        border-radius: 2px;
        animation: load-bar 1.2s ease-in-out forwards;
      }
      @keyframes splash-pulse {
        0%, 100% { box-shadow: 0 0 20px #FFE500aa; }
        50% { box-shadow: 0 0 50px #FFE500cc, 0 0 80px #FFE50055; }
      }
      @keyframes load-bar {
        0% { width: 0%; }
        60% { width: 75%; }
        100% { width: 100%; }
      }
    </style>
  </head>
  <body>
    <!-- Splash screen -->
    <div id="splash">
      <div class="splash-logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/>
        </svg>
      </div>
      <div class="splash-title">ViralForge AI</div>
      <div class="splash-bar-track"><div class="splash-bar"></div></div>
    </div>

    <div id="root"></div>

    <script>
      // Hide splash once React mounts
      window.__hideSplash = function() {
        const s = document.getElementById('splash');
        if (s) {
          s.classList.add('hidden');
          setTimeout(() => s.remove(), 450);
        }
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fallback: hide splash after 3s if React is slow
      setTimeout(() => { if (window.__hideSplash) window.__hideSplash(); }, 3000);
    </script>
  </body>
</html>
